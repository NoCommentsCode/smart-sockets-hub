<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Розетки — Smart Sockets Hub</title>
  <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body data-page="dashboard">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⚡</span>
      <div><h1>Smart Sockets Hub</h1><span class="brand-sub">Панель управления</span></div>
    </div>
    <div class="top-actions">
      <button id="all-on" class="btn small">Включить всё</button>
      <button id="all-off" class="btn small ghost">Выключить всё</button>
      <button id="refresh" class="btn small ghost">Обновить</button>
      <button id="scan" class="btn small ghost" hidden>Сканировать сеть</button>
      <a id="admin-link" class="btn small ghost" href="/admin" hidden>Админка</a>
      <span class="top-divider"></span>
      <span id="whoami" class="who"></span>
      <button id="profile-btn" class="btn small ghost">Профиль</button>
      <button id="logout" class="btn small ghost">Выйти</button>
    </div>
  </header>
  <main id="controllers" class="listing"></main>
  <script src="/static/app.js?v=5"></script>
</body>
</html>
