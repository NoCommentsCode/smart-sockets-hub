<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка — Smart Sockets Hub</title>
  <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body data-page="admin">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⚡</span>
      <div><h1>Smart Sockets Hub</h1><span class="brand-sub">Админ-панель</span></div>
    </div>
    <div class="top-actions">
      <a class="btn small ghost" href="/">← Розетки</a>
      <span class="top-divider"></span>
      <span id="whoami" class="who"></span>
      <button id="profile-btn" class="btn small ghost">Профиль</button>
      <button id="logout" class="btn small ghost">Выйти</button>
    </div>
  </header>

  <main class="admin-page">
    <section class="panel">
      <div class="panel-head">
        <div>
          <h2 class="panel-title">Пользователи</h2>
          <p class="muted">Учётные записи системы умных розеток</p>
        </div>
        <button id="add-user" class="btn primary">＋ Добавить пользователя</button>
      </div>

      <div class="toolbar">
        <input id="user-search" class="search" type="search" placeholder="Поиск по логину…" autocomplete="off">
        <select id="role-filter" class="select">
          <option value="all">Все роли</option>
          <option value="admin">Администраторы</option>
          <option value="user">Пользователи</option>
        </select>
      </div>

      <div id="users" class="user-list"></div>
    </section>
  </main>

  <script src="/static/app.js?v=4"></script>
</body>
</html>
