<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Админка — Умные розетки</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="admin">
  <header class="topbar">
    <h1>Пользователи</h1>
    <div class="top-actions">
      <a href="/">← К розеткам</a>
      <button id="logout" class="ghost">Выйти</button>
    </div>
  </header>
  <main class="admin-layout">
    <section class="card">
      <h2 id="form-title">Новый пользователь</h2>
      <form id="user-form">
        <input type="hidden" name="id">
        <input name="username" placeholder="Логин" required minlength="3">
        <input name="password" type="password" placeholder="Пароль (мин. 6 символов)" minlength="6">
        <select name="role">
          <option value="user">user</option>
          <option value="admin">admin</option>
        </select>
        <label class="check"><input type="checkbox" name="is_active" checked> Активен</label>
        <button type="submit">Сохранить</button>
        <button type="button" id="reset-form" class="ghost">Сбросить</button>
        <p id="form-error" class="error"></p>
      </form>
    </section>
    <section class="card">
      <table>
        <thead><tr><th>ID</th><th>Логин</th><th>Роль</th><th>Активен</th><th></th></tr></thead>
        <tbody id="users"></tbody>
      </table>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
